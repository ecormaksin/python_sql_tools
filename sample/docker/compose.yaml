services:
  mysql:
    build: 
      context: mysql
    ports:
      - ${CUSTOM_MYSQL_HOST_PORT:-3306}:3306
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - TZ=Asia/Tokyo
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-conf:/etc/mysql/conf.d
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/work:/work

  postgres:
    build:
      context: postgres
    ports:
      - ${CUSTOM_POSTGRES_HOST_PORT:-5432}:5432
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ=Asia/Tokyo
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/work:/work

volumes:
  mysql-data:
  mysql-conf:
  postgres-data:
